# ══════════════════════════════════════════════════════════════
#  RedFlag — Design System v5 · ULTRAVIOLET  ·  native theme foundation
#  Locks the app to dark mode and themes every native Streamlit
#  surface (widgets, menus, tooltips, dataframe, charts) to match
#  the injected CSS layer in app.py. Without this, Streamlit follows
#  the visitor's OS light/dark setting and native widgets clash.
# ══════════════════════════════════════════════════════════════

[theme]
base = "dark"

# ── Core surfaces ──
primaryColor             = "#8b5cf6"   # electric violet — buttons, focus, active
backgroundColor          = "#07060f"   # void violet-black app background
secondaryBackgroundColor = "#130f23"   # cards, widgets, code blocks
textColor                = "#d8d2f0"   # body text
borderColor              = "#261d46"   # widget borders
linkColor                = "#b39dfb"
linkUnderline            = false

# ── Code ──
codeBackgroundColor = "#0b0917"
codeTextColor       = "#d8d2f0"

# ── Semantic palette (matches tier + badge colors) ──
redColor    = "#ff3b5f"
orangeColor = "#ff7849"
yellowColor = "#fbbf24"
greenColor  = "#2dd4a0"
blueColor   = "#22d3ee"
violetColor = "#8b5cf6"
grayColor   = "#7d7795"

# ── Dataframe (findings table) ──
dataframeBorderColor           = "#261d46"
dataframeHeaderBackgroundColor = "#0b0917"

# ── Charts (Plotly donut, etc.) — tier-ordered ──
chartCategoricalColors = ["#ff3b5f", "#ff7849", "#fbbf24", "#2dd4a0", "#8b5cf6", "#22d3ee", "#7d7795"]

# ── Shape ──
baseRadius       = "large"   # 12px — matches card radii
buttonRadius     = "medium"  # 10px — matches primary button
showWidgetBorder = true

# ── Typography ──
# Loaded via Google Fonts at the theme level (non-render-blocking),
# replacing the @import in app.py's CSS.
font        = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont    = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
