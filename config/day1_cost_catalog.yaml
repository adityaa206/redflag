# config/day1_cost_catalog.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Day-1 INTEGRATION cost benchmarks (USD, sourced July 2026).
#
# Prices the connectivity model that analysis/day1.py recommends — i.e. what it
# costs to SAFELY CONNECT the acquired company, distinct from the vulnerability
# remediation the cost engine already prices.
#
# Every item cites a real, current source. These are order-of-magnitude
# benchmarks: replace a `base` with a vendor quote and set confidence: high to
# tighten the accuracy readout. Consumed by cost/day1_costing.py.
#
# Sources (all 2026):
#   Windows 365 / AVD  — Microsoft Azure pricing; Nerdio/GO-Global 2026 guides
#   Entra ID / Okta    — Microsoft Entra pricing; softwarepricingguide.com 2026
#   Cloudflare/Zscaler — Cloudflare Access & Zscaler ZPA pricing 2026
#   CrowdStrike EDR    — CrowdStrike pricing (Falcon Pro $99.99 / Ent $184.99/dev/yr)
#   CyberArk/BeyondTrust PAM — vendor pricing 2026 ($9–$400/user/yr)
#   Microsoft Sentinel — $2.46–$5.20/GB ingested (2026)
#   NGFW               — Palo Alto / Fortinet NGFW ($2K–$400K appliance)
#   M365 tenant→tenant — EPC Group / SkyTerra M&A migration 2026 ($300–600/user)
#   TSA run-rate       — Mayer Brown / M&A Science TSA cost-plus (5–50% markup)
#   Consulting         — security architect $150–$400/hr (Aristek/Salary.com 2026)

# ── Global assumptions (editable knobs) ───────────────────────────────────────
assumptions:
  default_headcount: 250       # acquired-company users, used if none supplied
  opex_months: 12              # year-1 window for recurring (OpEx) items
  tsa_months: 12               # default TSA duration (Isolate run-rate)
  privileged_user_ratio: 0.05  # ~5% of users need privileged (PAM) access

# ── Confidence → ± accuracy band (percent). Drives the UI accuracy readout. ────
accuracy_bands:
  high: 15
  medium: 30
  low: 50
assumed_headcount_penalty: 8   # extra ± added when headcount is a default guess

# ── Per connectivity model: the cost items that stand it up on Day 1 ──────────
# scale:  fixed | per_user | per_user_year | per_user_month | per_priv_user_year | tsa_runrate
models:
  isolate:
    items:
      - key: cleanroom_setup
        title: "Clean room / clean team standup"
        category: process
        capex_opex: capex
        scale: fixed
        low: 25000
        base: 60000
        high: 120000
        confidence: low
        source: "EY / Deloitte M&A clean-room practice (2026)"
      - key: perimeter_ngfw
        title: "Isolation-boundary firewall (NGFW) + inspection"
        category: architecture
        capex_opex: capex
        scale: fixed
        low: 15000
        base: 35000
        high: 90000
        confidence: medium
        source: "Palo Alto / Fortinet NGFW $2K–400K; SMB–mid band"
      - key: tsa_it_runrate
        title: "TSA IT run-rate (standalone ops under Transition Service Agreement)"
        category: process
        capex_opex: opex
        scale: tsa_runrate
        low: 120
        base: 200
        high: 320
        confidence: low
        source: "TSA cost-plus benchmarks (Mayer Brown, M&A Science); +5–50% markup"

